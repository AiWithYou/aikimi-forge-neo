version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: neo
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Tokyo
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: "/"
    target-branch: neo
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Tokyo
    groups:
      python-runtime:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: "/tools"
    target-branch: neo
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Tokyo
    groups:
      python-tools:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: "/extensions-builtin/forge_legacy_preprocessors"
    target-branch: neo
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Tokyo
    groups:
      legacy-preprocessor-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
