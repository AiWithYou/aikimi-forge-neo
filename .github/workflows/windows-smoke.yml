permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-313-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CUDA_VISIBLE_DEVICES: "-1"
      DIFFUSERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tools/requirements-test.txt
      - name: Update pip to the audited patch release
        run: python -m pip install --disable-pip-version-check pip==26.2.1
      - name: Install the pinned CPU PyTorch build
        run: >-
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          torch==2.11.0 torchvision==0.26.0
      - name: Install runtime requirements
        run: python -m pip install -r requirements.txt
      - name: Install browser test requirements
        run: python -m pip install -r tools/requirements-test.txt
      - name: Locate Chromium
        shell: pwsh
        run: |
          $candidates = @(
              (Get-Command chrome.exe -ErrorAction SilentlyContinue).Source,
              "C:\Program Files\Google\Chrome\Application\chrome.exe",
              "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"
          )
          $chromeBin = $candidates | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if (-not $chromeBin) {
              throw "Chrome or Chromium is required for the Windows smoke tests."
          }
          [IO.File]::AppendAllText(
              $env:GITHUB_ENV,
              "CHROME_BIN=$chromeBin`n",
              [Text.UTF8Encoding]::new($false)
          )
      - name: Import the security and built-in workflow modules
        run: >-
          python -c
          "import modules.aikimi_security;
          import modules.launch_utils;
          import modules_forge.minimax_h3_bridge;
          import modules_forge.sensenova_u15_bridge"
      - name: Run launch, security, and UI smoke tests
        run: >-
          python tools/run_ci_tests.py --verbosity 2
          --preload modules.shared
          --module tools.tests.test_aikimi_diagnostics
          --module tools.tests.test_aikimi_status
          --module tools.tests.test_aikimi_tabs
          --module tools.tests.test_aikimi_tabs_chromium
          --module tools.tests.test_additional_module_identity
          --module tools.tests.test_anima38_extension
          --module tools.tests.test_api_public_state
          --module tools.tests.test_api_script_args
          --module tools.tests.test_chromium_helpers
          --module tools.tests.test_ci_workflow_boundaries
          --module tools.tests.test_gpu_ownership
          --module tools.tests.test_minimax_h3_submission
          --module tools.tests.test_sensenova_worker_cleanup
          --module tools.tests.test_sensenova_u15_bridge
          --module tools.tests.test_extra_networks_lora_filter
          --module tools.tests.test_extras_usability
          --module tools.tests.test_grain_cleaner
          --module tools.tests.test_grain_postprocessing
          --module tools.tests.test_gradio_compatibility
          --module tools.tests.test_gradio_frontend_compat
          --module tools.tests.test_gradio_frontend_compat_chromium
          --module tools.tests.test_gradio_chromium_smoke
          --module tools.tests.test_gradio_file_security
          --module tools.tests.test_gradio_file_url_guard
          --module tools.tests.test_legacy_yaml_security
          --module tools.tests.test_launch_utils_environment
          --module tools.tests.test_minimax_h3_studio
          --module tools.tests.test_minimax_h3_setup
          --module tools.tests.test_option_migrations
          --module tools.tests.test_patcher_cleanup
          --module tools.tests.test_quant_ops_zero_scale
          --module tools.tests.test_remote_auth_middleware
          --module tools.tests.test_repository_privacy
          --module tools.tests.test_run_ci_tests
          --module tools.tests.test_safe_image_fetch
          --module tools.tests.test_security_redaction
          --module tools.tests.test_sensenova_u15_studio
          --module tools.tests.test_studio_css_boundaries
          --module tools.tests.test_sysinfo_security
          --module tools.tests.test_ui_tempdir_security
          --module tools.tests.test_upstream_neo_regressions
          --module tools.tests.test_workflow_ui
      - name: Start the real UI and run the full Chromium smoke
        shell: pwsh
        run: |
          $listener = [System.Net.Sockets.TcpListener]::new(
              [System.Net.IPAddress]::Loopback,
              0
          )
          $listener.Start()
          $smokePort = $listener.LocalEndpoint.Port
          $listener.Stop()

          $serverStdout = Join-Path $env:RUNNER_TEMP "aikimi-full-ui.stdout.log"
          $serverStderr = Join-Path $env:RUNNER_TEMP "aikimi-full-ui.stderr.log"
          $env:SD_WEBUI_RESTARTING = "1"
          $pythonPath = (Get-Command python.exe).Source
          $serverArguments = @(
              "launch.py",
              "--skip-prepare-environment",
              "--skip-python-version-check",
              "--skip-torch-cuda-test",
              "--ui-debug-mode",
              "--disable-extra-extensions",
              "--cpu",
              "--port",
              "$smokePort"
          )
          $serverProcess = Start-Process `
              -FilePath $pythonPath `
              -ArgumentList $serverArguments `
              -PassThru `
              -WindowStyle Hidden `
              -RedirectStandardOutput $serverStdout `
              -RedirectStandardError $serverStderr
          try {
              $deadline = [DateTime]::UtcNow.AddMinutes(3)
              $ready = $false
              while ([DateTime]::UtcNow -lt $deadline) {
                  if ($serverProcess.HasExited) {
                      break
                  }
                  try {
                      $response = Invoke-WebRequest `
                          -Uri "http://127.0.0.1:$smokePort/config" `
                          -UseBasicParsing `
                          -TimeoutSec 2
                      if ($response.StatusCode -eq 200) {
                          $ready = $true
                          break
                      }
                  } catch {
                      Start-Sleep -Milliseconds 500
                  }
              }
              if (-not $ready) {
                  Get-Content -LiteralPath $serverStdout -Tail 200 -ErrorAction SilentlyContinue
                  Get-Content -LiteralPath $serverStderr -Tail 200 -ErrorAction SilentlyContinue
                  throw "The full UI did not become ready on port $smokePort."
              }

              $env:AIKIMI_FULL_UI_URL = "http://127.0.0.1:$smokePort"
              python tools/run_ci_tests.py --verbosity 2 `
                  --preload modules.shared `
                  --module tools.tests.test_gradio_chromium_smoke.GradioFullUiChromiumTests
              if ($LASTEXITCODE -ne 0) {
                  throw "The full UI Chromium smoke failed with exit code $LASTEXITCODE."
              }
          } finally {
              if (-not $serverProcess.HasExited) {
                  $taskkill = Join-Path $env:SystemRoot "System32\taskkill.exe"
                  & $taskkill /PID $serverProcess.Id /T /F 2>$null | Out-Null
                  if (-not $serverProcess.WaitForExit(10000)) {
                      throw "The full UI process tree did not exit after taskkill."
                  }
              }
              $portReleased = $false
              for ($attempt = 0; $attempt -lt 20; $attempt++) {
                  $cleanupListener = [System.Net.Sockets.TcpListener]::new(
                      [System.Net.IPAddress]::Loopback,
                      $smokePort
                  )
                  try {
                      $cleanupListener.Start()
                      $portReleased = $true
                      break
                  } catch {
                      Start-Sleep -Milliseconds 250
                  } finally {
                      $cleanupListener.Stop()
                  }
              }
              if (-not $portReleased) {
                  throw "The full UI process did not release port $smokePort."
              }
              $global:LASTEXITCODE = 0
          }
