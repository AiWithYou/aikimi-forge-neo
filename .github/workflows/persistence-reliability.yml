name: Persistence and streaming reliability

on:
  pull_request:
    paths:
      - "modules/**"
      - "tools/tests/test_persistence_reliability.py"
      - "tools/tests/test_video_writer_ffmpeg.py"
      - "tools/tests/test_option_migrations.py"
      - "pyproject.toml"
      - ".github/workflows/persistence-reliability.yml"
  push:
    branches: [neo]
    paths:
      - "modules/**"
      - "tools/tests/test_persistence_reliability.py"
      - "tools/tests/test_video_writer_ffmpeg.py"
      - "tools/tests/test_option_migrations.py"
      - "pyproject.toml"
      - ".github/workflows/persistence-reliability.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  persistence:
    name: Persistence (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/persistence-reliability.yml
      - name: Install the minimal CPU test dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 Pillow==12.3.0 ruff==0.15.20
      - name: Install the real encoder for Linux integration tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends ffmpeg
          command -v ffmpeg
          command -v ffprobe
      - name: Check the focused helper and regression-test surface
        run: >-
          python -m ruff check
          modules/atomic_file.py modules/video_writer.py
          tools/tests/test_persistence_reliability.py tools/tests/test_video_writer_ffmpeg.py
      - name: Check formatting
        run: >-
          python -m ruff format --check
          modules/atomic_file.py modules/video_writer.py
          tools/tests/test_persistence_reliability.py tools/tests/test_video_writer_ffmpeg.py
      - name: Run settings, cleanup, streaming and encoder regressions
        run: >-
          python -m unittest -v
          tools.tests.test_persistence_reliability
          tools.tests.test_video_writer_ffmpeg
          tools.tests.test_option_migrations
