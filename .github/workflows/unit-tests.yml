name: CPU unit tests

on:
  pull_request:
    paths:
      - "**/*.css"
      - "**/*.js"
      - "**/*.py"
      - "pyproject.toml"
      - "requirements.txt"
      - "tools/requirements*.txt"
      - ".github/workflows/unit-tests.yml"
  push:
    branches: [neo]
    paths:
      - "**/*.css"
      - "**/*.js"
      - "**/*.py"
      - "pyproject.toml"
      - "requirements.txt"
      - "tools/requirements*.txt"
      - ".github/workflows/unit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-313-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tools/requirements-test.txt
      - name: Update pip to the audited patch release
        run: python -m pip install --disable-pip-version-check pip==26.2.1
      - name: Install the pinned CPU PyTorch build
        run: >-
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          torch==2.11.0 torchvision==0.26.0
      - name: Install runtime requirements
        run: python -m pip install -r requirements.txt
      - name: Install browser test requirements
        run: python -m pip install -r tools/requirements-test.txt
      - name: Locate Chromium
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Run the offline CPU suite
        run: python tools/run_ci_tests.py --verbosity 1
