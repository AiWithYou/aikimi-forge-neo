      - "tools/p_h3_image_manifest.json"
      - "tools/minimax_h3_runtime_manifest.json"
      - "tools/requirements-minimax-h3.*"
      - "tools/requirements-moss-image.*"
      - "aikimi-moss-image-setup.bat"
      - ".github/workflows/unit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-313-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tools/requirements-test.txt
      - name: Update pip to the audited patch release
        run: python -m pip install --disable-pip-version-check pip==26.2.1
      - name: Install the pinned CPU PyTorch build
        run: >-
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          torch==2.13.0 torchvision==0.28.0
      - name: Install runtime requirements
        run: python -m pip install -r requirements.txt
      - name: Install browser test requirements
        run: python -m pip install -r tools/requirements-test.txt
      - name: Locate Chromium
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Run the offline CPU suite
        run: python tools/run_ci_tests.py --verbosity 1
      - name: Run H3 workflow and Union 2.0 contracts
        run: >-
          python tools/run_ci_tests.py --pytest
          tools/tests/test_h3_handoff_store.py
          tools/tests/test_h3_handoff_runtime_pack.py
          tools/tests/test_h3_handoff_integration.py
          tools/tests/test_h3_compiler_default.py
          tools/tests/test_h3_union2_vae.py
          tools/tests/test_h3_union2_installers.py -q
      - name: Run H3 still-image contracts without model downloads
        run: >-
          python tools/run_ci_tests.py --pytest
          tools/tests/test_p_h3*.py tools/tests/test_official_h3_image.py -q
      - name: Test resolution rounding and JSON Builder
        run: node --test tools/tests/stage2.test.mjs tools/tests/stage3.test.mjs
      - name: Run local checkpoint and uv bootstrap CPU contracts
        run: >-
          python tools/run_ci_tests.py --pytest
          tools/tests/test_h3_checkpoint_modes.py
          tools/tests/test_qwen_single_file_quantization.py
          tools/tests/test_uv_bootstrap_upgrade.py -q
      - name: Run H3 workflow and Outpaint canvas contracts
        run: node --test tools/tests/h3_handoff_core.test.mjs tools/tests/qwen_outpaint_canvas.test.mjs
      - name: Run Clef clipboard contracts
        run: node --test tools/tests/clef_clipboard.test.mjs
      - name: Run FLUX 3 layout contracts
        run: node --test tools/tests/flux3_layout.test.mjs
      - name: Run image drop security contracts
        run: node --test tools/tests/dragdrop_security.test.mjs
      - name: Run UI helper contracts
        run: node --test tools/tests/ui_helpers.test.mjs
      - name: Run Clef contracts without model downloads
        run: python tools/run_ci_tests.py --pytest tools/tests/test_clef*.py -q
      - name: Run YuE2 contracts without model downloads
        run: python tools/run_ci_tests.py --pytest tests/yue2 -q
