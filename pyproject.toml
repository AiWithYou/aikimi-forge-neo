[tool.black]
line-length = 120
target-version = ["py313"]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = [
    "cache",
    "extensions",
    "models",
    "outputs",
    "repositories",
    "tmp",
    "venv",
    "vendor",
]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "N805", "S", "T", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"modules/aikimi_security/remote_access.py" = ["S104"]
"tools/run_ci_tests.py" = ["T201"]
"tools/tests/*.py" = ["S101"]
"tests/jev_sparse/*.py" = ["E402", "S101", "S104", "S105", "S106"]
"tools/benchmark_qwen21_sparse.py" = ["E402"]
"tools/benchmark_h3_sparse.py" = ["E402"]
"tools/qwen_image21_sparse_worker.py" = ["E402"]
"tools/setup_jev_sparse.py" = ["E402", "T201"]
"tools/report_jev_sparse.py" = ["T201"]
"modules_forge/minimax_h3_union2_vae.py" = ["S603", "S607"] # Fixed Git commit checked in the managed runtime.
"tools/prepare_minimax_h3_union2.py" = ["E402", "S310", "T201"] # Repo path bootstrap; HTTPS-only model API; CLI output.
"tools/upgrade_minimax_h3_union2_vae.py" = ["E402", "S603", "T201"] # Repo path bootstrap; reviewed local subprocess calls; CLI output.
"tools/qwen21_hub_release.py" = ["T201"] # Release metadata CLI output.
"tools/tests/test_h3_handoff_runtime_pack.py" = ["E402"]
"tools/tests/test_h3_handoff_store.py" = ["E402"]
"tools/tests/test_h3_union2_installers.py" = ["E402", "S603", "S607"]
"tools/tests/test_h3_union2_vae.py" = ["E402"]
